[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "saleae-mso-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for Saleae Logic MSO mixed-signal oscilloscopes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giorgi Magradze" }]
requires-python = ">=3.11"
keywords = ["saleae", "logic-mso", "oscilloscope", "mcp", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# saleae-mso-api is published on Saleae's own index:
#   pip install 'saleae-mso-mcp[hardware]' --extra-index-url https://downloads.saleae.com/pypi/
hardware = ["saleae-mso-api>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
saleae-mso-mcp = "saleae_mso_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/magradze/saleae_mso_mcp"
Issues = "https://github.com/magradze/saleae_mso_mcp/issues"

[tool.hatch.version]
path = "saleae_mso_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["saleae_mso_mcp"]

[tool.uv]
# Lets `uv sync --extra hardware` find saleae-mso-api.
index = [{ name = "saleae", url = "https://downloads.saleae.com/pypi/", explicit = true }]

[tool.uv.sources]
saleae-mso-api = { index = "saleae" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
